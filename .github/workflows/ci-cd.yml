name: Backend Operations CI/CD - Build, GHCR & Deploy K3s

on:
  push:
    branches:
      - dev
      - qa
      - prod
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Ambiente de despliegue en K3s'
        required: true
        default: 'cobroup-dev'
        type: choice
        options:
          - cobroup-dev
          - cobroup-qa
          - cobroup-prod

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore MS.Cobroup.Backend.slnx

      - name: Build Solution
        run: dotnet build MS.Cobroup.Backend.slnx -c Release --no-restore

      - name: Execute Tests
        run: dotnet test MS.Cobroup.Backend.slnx -c Release --no-build --verbosity normal

  build-and-push:
    name: Build & Push Docker Image to GHCR
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image-info.outputs.image }}
      environment: ${{ steps.env-info.outputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Environment
        id: env-info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.target_env }}"
          elif [ "${{ github.ref_name }}" = "prod" ] || [ "${{ github.ref_name }}" = "main" ]; then
            ENV="cobroup-prod"
          elif [ "${{ github.ref_name }}" = "qa" ]; then
            ENV="cobroup-qa"
          else
            ENV="cobroup-dev"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "Target Environment: $ENV"

      - name: Set Image Info
        id: image-info
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/ms-cobroup-backend"
          echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ms-cobroup-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ms-cobroup-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ms-cobroup-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K3s Cluster via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build-and-push.outputs.environment }}
    steps:
      - name: Checkout K8s manifests
        uses: actions/checkout@v4

      - name: Execute Deployment on Remote K3s Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GITHUB_SHA,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            set -euo pipefail
            TARGET_ENV="${{ needs.build-and-push.outputs.environment }}"
            IMAGE_TAG="ghcr.io/${{ github.repository_owner }}/ms-cobroup-backend:${{ github.sha }}"

            echo "================================================================="
            echo "Desplegando ms-cobroup-backend en K3s"
            echo "Namespace: $TARGET_ENV"
            echo "Imagen:    $IMAGE_TAG"
            echo "================================================================="

            # 1. Asegurar namespace
            kubectl create namespace "$TARGET_ENV" --dry-run=client -o yaml | kubectl apply -f -

            # 2. Configurar pull secret de GHCR
            kubectl create secret docker-registry ghcr-pull-secret \
              --namespace="$TARGET_ENV" \
              --docker-server=ghcr.io \
              --docker-username="${{ github.actor }}" \
              --docker-password="${{ secrets.GITHUB_TOKEN }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            # 3. Actualizar imagen en el Deployment de K3s
            kubectl set image deployment/ms-cobroup-backend backend="$IMAGE_TAG" -n "$TARGET_ENV"

            # 4. Esperar que el rollout termine exitosamente
            kubectl rollout status deployment/ms-cobroup-backend -n "$TARGET_ENV" --timeout=180s

            echo "Despliegue de ms-cobroup-backend completado en $TARGET_ENV."
            kubectl get pods -n "$TARGET_ENV" -l app=ms-cobroup-backend -o wide
